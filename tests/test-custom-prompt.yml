name: Test custom prompt input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          anthropic_api_key: fake-api-key-for-testing
          prompt: 'deploy my application to staging'
          max_turns: '2'

      - name: Assert sherpa_changes output is set
        env:
          ACTUAL: ${{ steps.action.outputs.sherpa_changes }}
        run: |
          echo "actual sherpa_changes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: sherpa_changes output should not be empty"
            exit 1
          fi
          echo "PASS: sherpa_changes output is set to '$ACTUAL'"

      - name: Assert sherpa_changes is false when no .sherpa.sh directory
        env:
          ACTUAL: ${{ steps.action.outputs.sherpa_changes }}
        run: |
          echo "actual sherpa_changes: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
