name: 'Sherpa.sh'
description: 'AI that ships your code. Deploy to any cloud with plain English.'
author: 'Sherpa.sh'
branding:
  icon: 'upload-cloud'
  color: 'purple'
inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  prompt:
    description: 'The prompt/context to pass to Sherpa deploy command'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for repo access (defaults to github.token)'
    required: false
    default: ${{ github.token }}
  max_turns:
    description: 'Maximum number of agentic turns'
    required: false
    default: '100'
outputs:
  result:
    description: 'The result of the Sherpa deployment'
    value: ${{ steps.claude.outputs.result }}
  sherpa_changes:
    description: 'Whether .sherpa.sh changes were committed'
    value: ${{ steps.commit-sherpa.outputs.committed }}
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Setup Node.js
      uses: chainguard-actions/actions-setup-node@031fc9bd73e651da81e6a7294b2af29e64d5f39c # v4
      with:
        node-version: '20'
    - name: Copy Sherpa plugin to workspace
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        # Copy sherpa plugin files from the action directory to workspace
        SHERPA_SRC="$ACTION_PATH/sherpa"
        SHERPA_DEST="$WORKSPACE/.sherpa-plugin"

        if [ -d "$SHERPA_SRC" ]; then
          cp -r "$SHERPA_SRC" "$SHERPA_DEST"
          echo "Copied Sherpa plugin to $SHERPA_DEST"
          ls -la "$SHERPA_DEST"
        else
          echo "Warning: Sherpa plugin not found at $SHERPA_SRC"
          exit 1
        fi
    - name: Install Claude Code CLI
      shell: bash
      run: npm install -g @anthropic-ai/claude-code
    - name: Run Claude Code with Sherpa
      id: claude
      shell: bash
      env:
        ENV_VARS_JSON: ${{ toJSON(env) }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_WORKSPACE: ${{ github.workspace }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_PROMPT: ${{ inputs.prompt }}
      run: |
        # Parse and export ALL env vars from the shared env context
        if [ "$ENV_VARS_JSON" != "{}" ] && [ -n "$ENV_VARS_JSON" ]; then
          while IFS= read -r line; do
            export "$line"
          done < <(printf '%s' "$ENV_VARS_JSON" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"')
        fi

        # Override with inputs (these take precedence)
        export ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
        export GITHUB_TOKEN="$GITHUB_TOKEN"

        # Run claude and capture output
        OUTPUT=$(claude \
          --dangerously-skip-permissions \
          --print \
          --plugin-dir "$INPUT_WORKSPACE/.sherpa-plugin" \
          --max-turns "$INPUT_MAX_TURNS" \
          "/Sherpa/deploy $INPUT_PROMPT" 2>&1) || true

        echo "$OUTPUT"

        # Set output using multiline delimiter, sanitizing to prevent injection
        safe_output=$(printf '%s' "$OUTPUT" | tr -d '\r')
        {
          echo "result<<EOF"
          echo "$safe_output"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Commit Sherpa changes
      id: commit-sherpa
      shell: bash
      run: |
        # Check if .sherpa.sh directory has changes
        if [ -d ".sherpa.sh" ]; then
          git config --local user.email "github-actions[Sherpa.sh]@users.noreply.github.com"
          git config --local user.name "github-actions[Sherpa.sh]"

          # Add .sherpa.sh directory
          git add .sherpa.sh/

          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit in .sherpa.sh"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sherpa.sh: update deployment memories

            Auto-generated by Sherpa Deploy Action"
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "Committed .sherpa.sh changes"
          fi
        else
          echo "No .sherpa.sh directory found"
          echo "committed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Push Sherpa changes
      if: steps.commit-sherpa.outputs.committed == 'true'
      shell: bash
      run: |
        git push
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
